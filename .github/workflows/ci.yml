name: Tap CI
on:
  pull_request:
  push:
    branches: [main, feature/distribution-pipeline]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: find Casks -name '*.rb' -exec ruby -c {} \;
